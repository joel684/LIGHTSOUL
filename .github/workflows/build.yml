name: build-apk

# UNIVERSAL ANDROID BUILD
# Upload any Gradle Android project as a .zip to this repo (phone: Add file -> Upload files).
# The newest zip is unpacked and built; the signed APK appears under the run's "Artifacts".
# One-time setup: add the secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD.
# Without them the build still works, but with a throwaway key (installing an update then needs an uninstall first).
# Run an older zip again: Actions -> build-apk -> Run workflow -> type the zip's file name.

on:
  push:
    paths:
      - '**.zip'
      - '**.git'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      zip:
        description: 'Zip file to build (leave empty for the newest one)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'          # only used when the project has no gradlew of its own
  VERSION_PREFIX: '1.6'          # versionName becomes <prefix>.<build number> for projects that read -PverName
  RELEASE_FOR: 'app.tjhome'      # package names that are also published as a GitHub release (the launcher self-updates from it)

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack the zip
        env:
          WANTED: ${{ github.event.inputs.zip }}
        run: |
          set -e
          f="$WANTED"
          if [ -z "$f" ]; then
            f=$(git log --name-only --diff-filter=AM --pretty=format: -- '*.zip' '*.git' | sed '/^$/d' | head -1)
          fi
          if [ -z "$f" ] || [ ! -f "$f" ]; then
            echo "::error::No zip file found in the repo"
            exit 1
          fi
          echo "Using: $f"
          rm -rf project
          mkdir project
          unzip -q -o "$f" -d project
          s=$(find project \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | awk '{ print length($0) " " $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$s" ]; then
            echo "::error::No settings.gradle in that zip - is it an Android Gradle project?"
            exit 1
          fi
          name=$(basename "$f")
          name=$(printf '%s' "${name%.*}" | tr -c 'A-Za-z0-9._-' '_')
          echo "PROJECT_DIR=$(dirname "$s")" >> "$GITHUB_ENV"
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "Project folder: $(dirname "$s")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build number
        run: echo "CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          B64: ${{ secrets.KEYSTORE_BASE64 }}
          SP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$B64" ] && [ -n "$SP" ] && [ -n "$KA" ] && [ -n "$KP" ]; then
            echo "$B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_PASSWORD=$SP"
              echo "KEY_ALIAS=$KA"
              echo "KEY_PASSWORD=$KP"
              echo "HAVE_KEY=1"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets are not all set - using a throwaway key"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass android -keypass android \
              -alias throwaway -dname "CN=throwaway" -keyalg RSA -keysize 2048 -validity 10000
            {
              echo "KEYSTORE_PASSWORD=android"
              echo "KEY_ALIAS=throwaway"
              echo "KEY_PASSWORD=android"
              echo "HAVE_KEY=0"
            } >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          if [ -f gradlew ]; then
            chmod +x gradlew
            G=./gradlew
          else
            G=gradle
          fi
          $G assembleRelease --no-daemon -PverCode="$CODE" -PverName="$VERSION_PREFIX.$CODE"

      - name: Collect APKs (and sign any that are unsigned)
        run: |
          set -e
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p out
          find "$PROJECT_DIR" -path '*/build/outputs/apk/*' -name '*.apk' | grep -i release > apks.txt || true
          if [ ! -s apks.txt ]; then
            find "$PROJECT_DIR" -path '*/build/outputs/apk/*' -name '*.apk' > apks.txt
          fi
          if [ ! -s apks.txt ]; then
            echo "::error::The build produced no APK"
            exit 1
          fi
          while IFS= read -r a; do
            base=$(basename "$a" .apk)
            if "$BT/apksigner" verify "$a" > /dev/null 2>&1; then
              cp "$a" "out/$NAME-$base.apk"
            else
              "$BT/zipalign" -f -p 4 "$a" "$RUNNER_TEMP/aligned.apk"
              "$BT/apksigner" sign --ks "$KEYSTORE_FILE" --ks-pass "pass:$KEYSTORE_PASSWORD" \
                --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" \
                --out "out/$NAME-$base.apk" "$RUNNER_TEMP/aligned.apk"
            fi
          done < apks.txt
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-apk
          path: out/*.apk

      - name: Publish a release (launcher only)
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          set -e
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          for a in out/*.apk; do
            pkg=$("$BT/aapt2" dump packagename "$a" 2> /dev/null || true)
            for want in $RELEASE_FOR; do
              if [ "$pkg" = "$want" ]; then
                if [ "$HAVE_KEY" != "1" ]; then
                  echo "::error::Not publishing $pkg: the permanent signing key is not set up"
                  exit 1
                fi
                cp "$a" "$RUNNER_TEMP/$NAME.apk"
                gh release create "v$CODE" "$RUNNER_TEMP/$NAME.apk" --title "$NAME $CODE" \
                  --notes "${NOTES:-Build $CODE}" --latest
                # keep only the 5 newest releases so the repo stays small
                gh release list --limit 100 --json tagName -q '.[].tagName' | tail -n +6 \
                  | xargs -r -I{} gh release delete {} --cleanup-tag -y
              fi
            done
          done
