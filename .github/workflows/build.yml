name: build-apk
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Finds the Gradle project: loose files in the repo, or inside a .zip of ANY name (unpacked here)
      - name: Find the project
        run: |
          ROOT=$(find . -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './_src/*' | head -n 1)
          if [ -z "$ROOT" ]; then
            ZIP=$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "::error::No Gradle project and no .zip file found in the repo."
              exit 1
            fi
            echo "Unpacking $ZIP"
            mkdir -p _src
            unzip -q "$ZIP" -d _src
            ROOT=$(find _src -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
            if [ -z "$ROOT" ]; then
              echo "::error::The zip has no settings.gradle inside."
              exit 1
            fi
          fi
          DIR=$(cd "$(dirname "$ROOT")" && pwd)
          echo "Project folder: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # build number = minutes since 1970: always grows, so every new build counts as an update
      - name: Build number
        run: echo "CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. Add the four signing secrets (see the Build section of the README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon -PverCode=$CODE -PverName=1.6.$CODE
          APK=$(find . -path '*/build/outputs/apk/release/*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Build finished but no release APK was found."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/_out"
          cp "$APK" "$GITHUB_WORKSPACE/_out/LIGHTSOUL.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LIGHTSOUL-apk
          path: _out/LIGHTSOUL.apk

      # publish only from the default branch; the launcher installs the newest release
      - name: Publish release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v$CODE" _out/LIGHTSOUL.apk --title "LIGHTSOUL $CODE" \
            --notes "${NOTES:-Build $CODE}" --latest
          # keep only the 5 newest releases so the repo stays small
          gh release list --limit 100 --json tagName -q '.[].tagName' | tail -n +6 \
            | xargs -r -I{} gh release delete {} --cleanup-tag -y
